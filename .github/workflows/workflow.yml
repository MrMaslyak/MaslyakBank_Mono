name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-docker:
    runs-on: ubuntu-latest

    steps:
      # --- 1. Клонируем репозиторий ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 2. Настраиваем JDK 21 ---
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # --- 3. Сборка и Docker для Transaction ---
      - name: Build and dockerize Transaction service
        run: |
          mvn -B clean install -DskipTests -f MaslyakBank_Transaction/pom.xml
          docker build -t maslyakbank-transaction -f MaslyakBank_Transaction/Dockerfile MaslyakBank_Transaction

      # --- 4. Сборка и Docker для Token ---
      - name: Build and dockerize Token service
        run: |
          mvn -B clean install -DskipTests -f MaslyakBank_Token/pom.xml
          docker build -t maslyakbank-token -f MaslyakBank_Token/Dockerfile MaslyakBank_Token

      # --- 5. Сборка и Docker для Core ---
      - name: Build and dockerize Core service
        run: |
          mvn -B clean install -DskipTests -f MaslyakBank_Core/pom.xml
          docker build -t maslyakbank-core -f MaslyakBank_Core/Dockerfile MaslyakBank_Core

      # --- 6. Сборка и Docker для Account ---
      - name: Build and dockerize Account service
        run: |
          mvn -B clean install -DskipTests -f MaslyakBank_Account/pom.xml
          docker build -t maslyakbank-account -f MaslyakBank_Account/Dockerfile MaslyakBank_Account

      # --- 7. Docker для Liquibase (инфраструктура) ---
      - name: Dockerize Liquibase
        run: |
          docker build -t maslyakbank-liquibase -f MaslyakBank_Infrastructure/liquibase-docker/Dockerfile MaslyakBank_Infrastructure

  # --- Шаг 2: Запуск тестов ---
  test:
    runs-on: ubuntu-latest
    needs: build-and-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run all tests
        run: mvn -B test

  # --- Шаг 3: Деплой через Docker Compose ---
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Запуск сервисов через Docker Compose ---
      - name: Start infrastructure
        run: docker compose -f MaslyakBank_Infrastructure/compose-infrastructure.yaml up -d

      - name: Start Transaction service
        run: docker compose -f MaslyakBank_Transaction/compose-transaction.yaml up -d

      - name: Start Token service
        run: docker compose -f MaslyakBank_Token/compose-token.yaml up -d

      - name: Start Core service
        run: docker compose -f MaslyakBank_Core/compose-core.yaml up -d

      - name: Start Account service
        run: docker compose -f MaslyakBank_Account/compose-account.yaml up -d

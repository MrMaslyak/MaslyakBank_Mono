name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  # --- Шаг 1: Сборка проекта без тестов ---
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build project (skip tests)
        run: mvn -B clean install -DskipTests

  # --- Шаг 2: Запуск тестов ---
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run all tests
        run: mvn -B test

  # --- Шаг 3: Деплой через Docker Compose ---
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'slim'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3



      - name: Build and start transaction service
        run: |
          docker compose -f MaslyakBank_Transaction/compose-transaction.yaml down
          docker compose -f MaslyakBank_Transaction/compose-transaction.yaml up -d --build

      - name: Build and start token service
        run: |
          docker compose -f MaslyakBank_Token/compose-token.yaml down
          docker compose -f MaslyakBank_Token/compose-token.yaml up -d --build

      - name: Build and start core service
        run: |
          docker compose -f MaslyakBank_Core/compose-core.yaml down
          docker compose -f MaslyakBank_Core/compose-core.yaml up -d --build

      - name: Build and start account service
        run: |
          docker compose -f MaslyakBank_Account/compose-account.yaml down
          docker compose -f MaslyakBank_Account/compose-account.yaml up -d --build

      - name: Build and start infrastructure
        run: |
          docker compose -f MaslyakBank_Infrastructure/compose-infrastructure.yaml down
          docker compose -f MaslyakBank_Infrastructure/compose-infrastructure.yaml up -d --build

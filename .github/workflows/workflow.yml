name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  # --- Шаг 1: Сборка проекта без тестов ---
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # --- Шаг 1: Сборка всех jar файлов ---
      - name: Build all services
        run: |
          mvn -B clean install -DskipTests -f MaslyakBank_Transaction/pom.xml
          mvn -B clean install -DskipTests -f MaslyakBank_Token/pom.xml
          mvn -B clean install -DskipTests -f MaslyakBank_Core/pom.xml
          mvn -B clean install -DskipTests -f MaslyakBank_Account/pom.xml

      # --- Шаг 2: Билдим Docker-образы для каждого сервиса ---
#      - name: Build Docker images
#        run: |
#          docker build -t maslyakbank-transaction -f MaslyakBank_Transaction/Dockerfile MaslyakBank_Transaction
#          docker build -t maslyakbank-token -f MaslyakBank_Token/Dockerfile MaslyakBank_Token
#          docker build -t maslyakbank-core -f MaslyakBank_Core/Dockerfile MaslyakBank_Core
#          docker build -t maslyakbank-account -f MaslyakBank_Account/Dockerfile MaslyakBank_Account
#          docker build -t maslyakbank-liquibase -f MaslyakBank_Infrastructure/liquibase-docker/Dockerfile MaslyakBank_Infrastructure


  # --- Шаг 2: Запуск тестов ---
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run all tests
        run: mvn -B test

  # --- Шаг 3: Деплой через Docker Compose ---
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3



      - name: Start transaction service
        run: |
          docker compose -f MaslyakBank_Transaction/compose-transaction.yaml up --build -d

      - name: Start token service
        run: |
          docker compose -f MaslyakBank_Token/compose-token.yaml up --build -d

      - name: Start core service
        run: |
          docker compose -f MaslyakBank_Core/compose-core.yaml up --build -d

      - name: Start account service
        run: |
          docker compose -f MaslyakBank_Account/compose-account.yaml up --build -d

      - name: Start infrastructure
        run: |
             docker compose -f MaslyakBank_Infrastructure/compose-infrastructure.yaml up --build -d

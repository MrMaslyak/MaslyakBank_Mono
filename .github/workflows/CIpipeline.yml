name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-docker:
    runs-on: macOS
    strategy:
      matrix:
        service:
          - name: Transaction
            docker: transaction
          - name: Token
            docker: token
          - name: Core
            docker: core
          - name: Account
            docker: account
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and dockerize services
        run: |
          mvn -B clean package -DskipTests -f MaslyakBank_${{ matrix.service.name }}/pom.xml
          docker build -t maslyakbank-${{ matrix.service.docker }} -f MaslyakBank_${{ matrix.service.name }}/Dockerfile MaslyakBank_${{ matrix.service.name }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service.docker }}-jar
          path: MaslyakBank_${{ matrix.service.name }}/target/*.jar

  test:
    runs-on: macOS
    needs: build-and-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run all tests
        run: mvn -B test

  deploy:
    runs-on: macOS
    needs: test
    strategy:
      matrix:
        service:
          - name: Transaction
            docker: transaction
          - name: Token
            docker: token
          - name: Core
            docker: core
          - name: Account
            docker: account
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

#      - name: Download artifact
#        uses: actions/download-artifact@v4
#        with:
#          name: ${{ matrix.service.docker }}-jar
#          path: MaslyakBank_${{ matrix.service.name }}/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

#      - name: Create Docker network On Windows
#        shell: cmd
#        run: |
#          docker network create MaslyakBankNetwork 2>nul || exit /b 0

      - name: Create Docker network on Mac
        shell: bash
        run: |
          docker network create MaslyakBankNetwork 2>/dev/null || true
            
         # --- Запуск сервисов через Docker Compose ---
      - name: Start services
        run: docker compose -f MaslyakBank_${{matrix.service.name}}/compose-${{matrix.service.docker}}.yaml up -d
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}


name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-docker:
    runs-on: macOS
    strategy:
      matrix:
        service:
          - name: Transaction
            docker: transaction
          - name: Token
            docker: token
          - name: Core
            docker: core
          - name: Account
            docker: account

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build service and Docker image
        run: |
          mvn -B clean package -DskipTests -f MaslyakBank_${{ matrix.service.name }}/pom.xml
          docker build -t maslyakbank-${{ matrix.service.docker }} \
            -f MaslyakBank_${{ matrix.service.name }}/Dockerfile \
            MaslyakBank_${{ matrix.service.name }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service.docker }}-jar
          path: MaslyakBank_${{ matrix.service.name }}/target/*.jar

  test:
    runs-on: macOS
    needs: build-and-docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests
        run: mvn -B test


  deploy-infrastructure:
    runs-on: PCMaslyak
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Docker network (if not exists) Windows
        shell: cmd
        run: docker network create MaslyakBankNetwork 2>nul || exit /b 0

#      - name: Create Docker network (if not exists) macOS
#        shell: bash
#        run: docker network inspect MaslyakBankNetwork >/dev/null 2>&1 || docker network create MaslyakBankNetwork

      - name: Start Postgres & Redis & Liquibase
        shell: cmd
        run: docker compose -f MaslyakBank_Infrastructure/compose-infrastructure.yaml up -d
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

#      - name: Init liquibase
#        shell: cmd
#        run: |
#

      - name: Init && Deploy Database Structure (Liquibase)
        shell: cmd
        run: |
          docker exec maslyakbank-liquibase liquibase init project
          docker exec maslyakbank-liquibase liquibase --defaultsFile=/MaslyakBank_Infrastructure/liquibase-docker/db.changelog-migration.yaml update
  deploy:
    runs-on: PCMaslyak
    needs: deploy-infrastructure
    strategy:
      matrix:
        service:
          - name: Transaction
            docker: transaction
          - name: Token
            docker: token
          - name: Core
            docker: core
          - name: Account
            docker: account

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service.docker }}-jar
          path: MaslyakBank_${{ matrix.service.name }}/target/

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start service
        shell: cmd
        run: docker compose -f MaslyakBank_${{matrix.service.name}}/compose-${{matrix.service.docker}}.yaml up -d
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

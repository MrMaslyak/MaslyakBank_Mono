version: '3.9'

services:
  db:
    image: postgres:latest
    container_name: maslyakbank-database
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "7777:5432"
    networks:
      - MaslyakBankNetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  liquibase-cli:
    build:
      context: .
      dockerfile: liquibase-docker/Dockerfile
    container_name: maslyakbank-liquibase
    depends_on:
      db:
        condition: service_healthy
    networks:
      - MaslyakBankNetwork
    volumes:
      - ./liquibase-docker:/liquibase-docker
    stdin_open: true
    tty: true

  redis:
    image: redis:latest
    container_name: maslyakbank_infrastructure-redis-1
    restart: always
    ports:
      - "6666:6379"
    networks:
      - MaslyakBankNetwork
    volumes:
      - ./redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  MaslyakBankNetwork:
    external: true

volumes:
  pgdata:
